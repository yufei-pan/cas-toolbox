[project]
name = "cas-toolbox"
version = "2026.46.1"
description = "Cluster Automation Scripts Toolbox"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "hpcp==9.83",
    "multicmd==1.58",
    "multissh3==6.44",
    "simple-iotest==3.70.0",
    "statbtrfs==0.40",
    "tee-logger==6.44",
    "tsvz==5.7",
    "statblk==1.60",
    "firewatcher==1.66",
]
authors = [
    { name = "Yufei Pan", email = "pan@zopyr.us" }
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Operating System :: POSIX :: Linux",
]
license = {text = "GPL-3.0-or-later"}

[project.scripts]
hpcp = "hpcp:main"
mcmd = "multiCMD:main"
multicmd = "multiCMD:main"
mssh = "multiSSH3:main"
mssh3 = "multiSSH3:main"
multissh = "multiSSH3:main"
multissh3 = "multiSSH3:main"
mssh-complete = "mssh_complete:main"
iotest = "iotest:climain"
simple-iotest = "iotest:climain"
statbtrfs = "statbtrfs:main"
tsvz = "TSVZ:__main__"
statblk = "statblk:main"
firewatcher = "firewatcher:main"


# multiCMD, multiSSH3 and TSVZ (the mixed-case spellings) are script files here and not entry points: pip 9 (stock on EL7 and
# EL8) cannot upgrade or uninstall a package whose entry_points.txt has two commands that differ only in case. This package
# still owns all 17 commands, as the releases before it did: an upgrade from one keeps them, and uv and pipx find them here.
[tool.setuptools]
script-files = ["scripts/multiCMD", "scripts/multiSSH3", "scripts/TSVZ"]

[project.urls]
'Homepage' = "https://github.com/yufei-pan/cas-toolbox"
'hpcp' = "https://github.com/yufei-pan/hpcp"
"multiCMD" = "https://github.com/yufei-pan/multiCMD"
"multiSSH3" = "https://github.com/yufei-pan/multiSSH3"
"simple-iotest" = "https://github.com/yufei-pan/simple-iotest"
"statbtrfs" = "https://github.com/yufei-pan/statbtrfs"
"Tee_Logger" = "https://github.com/yufei-pan/Tee_Logger"
"TSVZ" = "https://github.com/tsvz-org/TSVZ"
"iotest" = "https://github.com/yufei-pan/simple-iotest"
"firewatcher" = "https://github.com/yufei-pan/firewatcher"
